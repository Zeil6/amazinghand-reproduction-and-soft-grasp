[soft_grasp]
# Disabled by default: these raw-load thresholds are safe starting placeholders, not calibrated values.
enabled = false
feedback_hz = 10
command_hz = 100
goal_speed_rad_s = 1.0
load_filter_alpha = 0.2
contact_confirm_samples = 5
release_confirm_samples = 3
max_position_step_rad = 0.01
hold_deadband = 20
communication_timeout_ms = 200
baseline_samples = 25
max_temperature_c = 60
min_voltage_v = 4.5
max_voltage_v = 7.2
# SCS0009 register 62 is commonly reported in 0.1 V units; verify on the actual bus.
voltage_scale_v_per_raw = 0.1
fault_action = "hold"
fault_backoff_rad = 0.02

[[soft_grasp.fingers]]
name = "finger1"
contact_load_threshold = 180
target_hold_load = 220
max_load = 450
closing_sign_motor1 = 1.0
closing_sign_motor2 = -1.0

